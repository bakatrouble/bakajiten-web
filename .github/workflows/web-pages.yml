# Build the bakajiten web frontend and publish it to the repo's
# project page (https://bakatrouble.github.io/bakajiten-web/).
# The WASM/TypeScript bindings regenerate from the backend
# workspace, so CI checks out bakatrouble/bakajiten as the layout
# root and this repo into its frontends/web slot (the same shape
# local dev uses). Dictionary artifacts ship inside the deploy
# (fetched from the data release into public/data/, served
# same-origin at /bakajiten-web/data) — no CORS proxy, nothing
# vendored into git. Data releases re-trigger this workflow via
# repository_dispatch (data-updated, sent by the data repo's pack
# job), so the hosted artifacts track the latest data release.
#
# Setup (once): bakajiten-web repo → Settings → Pages → Source →
# GitHub Actions.
name: web-pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [data-updated]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend workspace
        uses: actions/checkout@v7
        with:
          repository: bakatrouble/bakajiten
          path: main
      - name: Check out frontend
        uses: actions/checkout@v7
        with:
          path: main/frontends/web
      - name: Rust toolchain (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cargo cache (registry, target, installed binaries)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: main
      - name: Install uniffi-bindgen-js
        run: |
          if ! command -v uniffi-bindgen-js >/dev/null; then
            cargo install uniffi-bindgen-js --version 0.2.1
          fi
      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: main/frontends/web/pnpm-lock.yaml
      - name: Build backend WASM artifacts
        working-directory: main
        run: cargo build --release -p libdict -p librecognizer --target wasm32-unknown-unknown
      - name: Install frontend dependencies
        working-directory: main/frontends/web
        run: pnpm install --frozen-lockfile
      - name: Fetch dictionary artifacts
        working-directory: main/frontends/web
        run: |
          # Bundle the triggering data release when dispatched from
          # the data repo's pack job, else the current latest. Lands
          # in public/data/ (gitignored), served same-origin.
          TAG="${{ github.event.client_payload.tag }}"
          if [ -n "$TAG" ]; then
            export BAKAJITEN_DATA_BASE="https://github.com/bakatrouble/bakajiten-data/releases/download/$TAG"
          fi
          echo "data base: ${BAKAJITEN_DATA_BASE:-<latest release>}"
          pnpm fetch-data
      - name: Build frontend
        working-directory: main/frontends/web
        run: pnpm build
        env:
          PAGES_BASE: /bakajiten-web/
          # Relative: the data dir rides the deploy subpath
          # (project page, custom domain) instead of naming it.
          VITE_DATA_BASE: data
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: main/frontends/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
